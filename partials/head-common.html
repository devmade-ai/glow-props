<!-- Requirement: Prevent dark mode flash on page load
     Approach: Inline classic script reads localStorage and sets both .dark class
       (for Tailwind dark: variant) and data-theme (for DaisyUI component colors)
       before first paint. Must be classic script (not type="module") to execute
       synchronously during HTML parse.
     Alternative: Let DaisyUI auto-detect via prefers-color-scheme only — rejected,
       no manual toggle persistence
     Alternative: External script partial — rejected, must remain inline for
       synchronous execution before first paint -->
<script>
  (function() {
    try {
      // Requirement: Prevent flash using stored per-mode theme + dark/light preference
      // Reads lightTheme/darkTheme directly — no combo map needed.
      // Defaults must stay in sync with theme.js constants.
      var stored = localStorage.getItem('darkMode');
      var isDark = stored !== null
        ? stored === 'true'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = isDark
        ? (localStorage.getItem('darkTheme') || 'coffee')
        : (localStorage.getItem('lightTheme') || 'caramellatte');

      // Requirement: Theme lists for random picker AND validation
      // Approach: Single set of arrays used for both random selection and stored theme
      //   validation. Must stay in sync with theme.js and the picker buttons in navbar.html.
      var lt = ['caramellatte','cupcake','pastel','lofi','nord','emerald','garden',
        'autumn','valentine','fantasy','retro','corporate','silk','bumblebee',
        'lemonade','winter','cmyk','acid','cyberpunk','wireframe','light'];
      var dt = ['coffee','dim','night','dracula','forest','luxury','synthwave',
        'black','halloween','sunset','abyss','business','aqua','dark'];

      // Requirement: Random theme on load when enabled
      // Approach: Pick a random theme from the current mode's list before first paint.
      //   Persists the chosen theme so the picker indicator matches.
      if (localStorage.getItem('randomThemeOnLoad') === 'true') {
        var list = isDark ? dt : lt;
        theme = list[Math.floor(Math.random() * list.length)];
        localStorage.setItem(isDark ? 'darkTheme' : 'lightTheme', theme);
      }

      // Requirement: Validate stored theme against known lists to prevent unstyled content
      // Approach: Reuse lt/dt arrays. Fall back to default if corrupted.
      if ((isDark ? dt : lt).indexOf(theme) === -1) {
        theme = isDark ? 'coffee' : 'caramellatte';
      }

      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      document.documentElement.setAttribute('data-theme', theme);

      // Requirement: Set PWA status bar color before first paint to prevent flash
      // Approach: Compact color map duplicated from theme.js (inline scripts can't import modules).
      //   Light themes: primary or neutral hex. Dark themes: base-100 hex.
      //   All values chosen so white status bar text is always legible.
      // Auto-generated by scripts/generate-meta-colors.mjs — do not edit manually.
      var mc = {
        retro:'#56524c',bumblebee:'#433f3a',fantasy:'#6d0076',lofi:'#0d0d0d',garden:'#291e00',
        pastel:'#61738d',cupcake:'#262629',emerald:'#333c4d',light:'#422ad5',silk:'#1c1c29',
        nord:'#4c566a',cyberpunk:'#111a3b',acid:'#140151',caramellatte:'#000000',
        corporate:'#000000',autumn:'#8c0327',wireframe:'#161616',valentine:'#830c41',
        cmyk:'#1a1a1a',winter:'#0069ff',lemonade:'#343300',aqua:'#1a368b',coffee:'#261b25',
        halloween:'#1b1816',night:'#0f172a',dark:'#1d232a',synthwave:'#09002f',dim:'#2a303c',
        business:'#202020',sunset:'#121c22',forest:'#1b1717',dracula:'#282a36',abyss:'#001e29',
        luxury:'#09090b',black:'#000000'
      };
      var color = mc[theme] || '#808080';
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
    } catch(e) {
      // Requirement: Never break page render if localStorage is unavailable (sandboxed iframe, private browsing)
      // Approach: Catch all errors and fall back to default theme — better a flash than a broken page.
      // This intentionally does not log (console may not be available in all environments).
    }
  })();
</script>

<!-- Requirement: Capture beforeinstallprompt before framework mounts
     Approach: Stash the event on window for pwa.js to consume later.
       On repeat visits with a cached SW, the event fires before any module
       scripts run — if nothing catches it, the install prompt is permanently lost.
     Alternative: Listen in pwa.js only — rejected, misses the early-fire case -->
<script>
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__pwaInstallPromptEvent = e;
  });
</script>
