name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Requirement: only one Pages deploy in flight at a time.
# Approach: queue them — a later run waits rather than killing the one running.
# Alternatives:
#   - cancel-in-progress: true (what this was): Rejected — GitHub's own Pages
#     workflow specifies false, because killing a run mid-deploy-pages leaves the
#     Pages backend holding a deployment that never completes, and the next
#     deployment then queues behind it indefinitely. Cancelling a publish to save
#     a few runner-minutes trades a cheap wait for a wedged environment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Skip the browser download here and fetch only chromium below — the
      # playwright package would otherwise pull all three engines on every run
      # for a check that uses one.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # Source-level, so it runs before the build — no reason to spend a build
      # on a tree that already fails the check. TIMER_LEAKS.md.
      - name: Verify timer cleanup (docs/implementations/TIMER_LEAKS.md)
        run: npm run verify:timer-cleanup

      - run: npm run build

      # Gate the publish on the SEO tripwire. It reads dist/, so it has to run
      # after the build — and before upload-pages-artifact, so a failure stops
      # the deploy rather than being discovered on the live site.
      #
      # This step exists because that is exactly how the last two defects were
      # found: prerendered pages that all unfurled identically, then all 12
      # carrying a duplicate <meta name="description">. Both built cleanly and
      # were only visible in the served HTML. The checker could have caught the
      # second, but nothing ran it — a tripwire that fires only when someone
      # remembers to type the command is documentation, not a gate.
      #
      # Safe to fail here: the build has already succeeded and nothing is
      # published yet, so a red run just leaves the previous deploy serving.
      - name: Verify discoverability (docs/implementations/DISCOVERABILITY.md)
        run: npm run verify:seo

      # Same shape and reason as verify:seo — reads dist/, so it runs after the
      # build and gates the publish. An un-versioned icon URL or a duplicate
      # precache entry ships silently otherwise.
      - name: Verify icon cache-busting (docs/implementations/PWA_ICON_CACHE_BUST.md)
        run: npm run verify:icons

      # Source-graph check, so it does NOT need the build — but it gates the
      # publish for the same reason as the two above. This is the tripwire for
      # the invariant that keeps prerenderPages() working at all: if the SSR
      # entry ever reaches src/lib/pwa.js, the SSG pass fails pointing at a
      # virtual module rather than at the import that caused it.
      - name: Verify SSR safety (docs/implementations/PWA_SYSTEM.md)
        run: npm run verify:ssr-safety

      # The only gate that covers the RUNTIME half of the structured data. The
      # other three read files; this one loads the built pages in a browser,
      # which is the only way to see what src/seoMeta.js does to the JSON-LD
      # block on the ?name= entry points.
      #
      # It earns the browser: making seoMeta.js append a second block instead of
      # rewriting the existing one leaves verify:seo green — dist/ is unchanged —
      # and fails this check on all four item routes.
      # Cache the browser: without this every deploy re-downloads ~170 MB, which
      # both slows the job and adds a network failure mode to a step that has
      # nothing to do with the code being deployed. Keyed on the resolved
      # Playwright version — a browser build is only valid for the version that
      # asked for it, so a bump must miss the cache rather than reuse a stale one.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Two branches because --with-deps also downloads; on a cache hit only the
      # OS libraries are needed. Both still touch apt, which is the residual cost.
      - name: Install Chromium for the smoke check
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Smoke structured data in a browser (DISCOVERABILITY.md)
        run: npm run smoke:seo

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Requirement: don't report a slow Pages queue as a dead one.
      # Approach: 30 minutes instead of the 10-minute default.
      # Why: the action polls `deployment_queued` and, on timeout, CANCELS the
      # deployment it was waiting for — so a queue that merely drains slowly is
      # both misreported as a failure and actively torn down. Waiting longer
      # costs runner-minutes only when something is already wrong.
      # Alternatives:
      #   - Leave the default and re-run: Rejected — a re-run reuses the run's
      #     artifact, so the second upload makes two named `github-pages` and
      #     deploy-pages aborts with "Artifact count is 2". Retrying is the one
      #     recovery that is guaranteed not to work.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
