<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Loading... — devmade-ai</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <!-- Requirement: Prevent dark mode flash (same pattern as index.html)
       Approach: Inline classic script sets .dark class + data-theme before first paint -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('darkMode');
        var isDark = stored !== null
          ? stored === 'true'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Fonts: Space Grotesk for headings, Inter for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="main.css">
</head>
<body class="bg-base-100 text-base-content min-h-screen">

  <!-- Header — Navbar with burger menu (same pattern as index.html) -->
  <nav class="navbar bg-base-100/80 backdrop-blur-md sticky top-0 z-30 border-b border-base-300 no-print"
       style="padding-top: env(safe-area-inset-top); padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right));">
    <div class="flex-1">
      <a href="./" class="inline-flex items-center gap-2 no-underline hover:opacity-80 transition-opacity" aria-label="devmade-ai home">
        <img src="assets/images/icon-192.png" alt="" width="36" height="36" class="rounded-lg shrink-0">
        <span class="font-bold text-base-content text-lg">devmade-ai</span>
      </a>
    </div>
    <div class="flex-none">
      <div class="relative">
        <button type="button"
                class="btn btn-ghost btn-square"
                id="burger-trigger"
                aria-expanded="false"
                aria-controls="burger-menu"
                aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <div class="fixed inset-0 z-backdrop cursor-pointer" id="burger-backdrop" hidden></div>
        <div class="absolute right-0 top-full mt-2 z-dropdown w-56 max-w-[calc(100vw-2rem)]
                    rounded-xl shadow-lg bg-base-100 border border-base-300
                    py-1 overscroll-contain"
             id="burger-menu"
             role="navigation"
             aria-label="Main navigation"
             hidden>
          <ul class="list-none m-0 p-0 flex flex-col">
            <li><a href="./#projects" class="block w-full text-left px-4 py-2.5 text-sm text-base-content
                     hover:bg-base-200 transition-colors cursor-pointer no-underline
                     focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-[-2px]
                     min-h-11 flex items-center" data-close>Projects</a></li>
            <li><a href="./#tools" class="block w-full text-left px-4 py-2.5 text-sm text-base-content
                     hover:bg-base-200 transition-colors cursor-pointer no-underline
                     focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-[-2px]
                     min-h-11 flex items-center" data-close>Tools</a></li>
            <li><a href="./#patterns" class="block w-full text-left px-4 py-2.5 text-sm text-base-content
                     hover:bg-base-200 transition-colors cursor-pointer no-underline
                     focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-[-2px]
                     min-h-11 flex items-center" data-close>Patterns</a></li>
            <li><hr class="my-1 border-base-300"></li>
            <li><button type="button" id="theme-toggle"
                        class="block w-full text-left px-4 py-2.5 text-sm text-base-content
                               hover:bg-base-200 transition-colors cursor-pointer
                               focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-[-2px]
                               min-h-11 flex items-center">
              <span class="theme-label-dark hidden">Light mode</span>
              <span class="theme-label-light">Dark mode</span>
            </button></li>
            <li><button type="button"
                        class="block w-full text-left px-4 py-2.5 text-sm text-base-content
                               hover:bg-base-200 transition-colors cursor-pointer
                               focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-[-2px]
                               min-h-11 flex items-center"
                        onclick="window.print()" data-close>Save as PDF</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="app">
      <p class="text-center py-16 text-base-content/40">Loading...</p>
    </div>
  </main>

  <footer class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center border-t border-base-300"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom));">
    <p class="text-sm text-base-content/40">
      <a href="https://github.com/devmade-ai" target="_blank" rel="noopener" class="link link-hover text-base-content/40 hover:text-base-content/70">github.com/devmade-ai</a>
    </p>
  </footer>

  <script src="theme.js"></script>
  <!-- Requirement: Render markdown docs client-side without a build step
       Approach: Lightweight custom parser for common markdown (headings, lists, code, tables, links)
       Alternative: marked.js from CDN — rejected, adds external dependency and ~40KB download -->
  <script>
    (function () {
      var app = document.getElementById('app');
      var params = new URLSearchParams(window.location.search);
      var projectName = params.get('name');

      if (!projectName) {
        app.innerHTML = '<div class="text-center py-16"><h1 class="text-2xl font-bold mb-2">No project specified</h1><p class="text-base-content/60"><a href="./" class="link link-primary">Back to portfolio</a></p></div>';
        return;
      }

      var basePath = 'projects/' + encodeURIComponent(projectName) + '/';
      var meta = null;
      var docs = {};
      var currentTab = 'readme';

      function renderMarkdown(md) {
        if (!md) return '';
        var html = md
          .replace(/```(\w*)\n([\s\S]*?)```/g, function (_, lang, code) {
            return '<pre class="bg-base-300/50 rounded-lg p-4 overflow-x-auto text-sm"><code>' + escapeHtml(code.trim()) + '</code></pre>';
          })
          .replace(/^\|(.+)\|\s*\n\|[\s\-:|]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm, function (_, header, body) {
            var ths = header.split('|').map(function (h) { return '<th class="px-3 py-2 text-left text-sm font-semibold border-b border-base-300">' + escapeHtml(h.trim()) + '</th>'; }).join('');
            var rows = body.trim().split('\n').map(function (row) {
              var tds = row.replace(/^\||\|$/g, '').split('|').map(function (d) { return '<td class="px-3 py-2 text-sm border-b border-base-300/50">' + inlineMarkdown(d.trim()) + '</td>'; }).join('');
              return '<tr class="hover:bg-base-200/50">' + tds + '</tr>';
            }).join('');
            return '<div class="overflow-x-auto"><table class="w-full"><thead><tr>' + ths + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
          })
          .replace(/^#### (.+)$/gm, '<h4 class="text-base font-semibold mt-4 mb-1.5">$1</h4>')
          .replace(/^### (.+)$/gm, '<h3 class="text-lg font-semibold mt-5 mb-2">$1</h3>')
          .replace(/^## (.+)$/gm, '<h2 class="text-xl font-bold mt-6 mb-2 pb-1.5 border-b border-base-300">$1</h2>')
          .replace(/^# (.+)$/gm, '<h1 class="text-2xl font-bold mt-6 mb-3">$1</h1>')
          .replace(/^---+$/gm, '<hr class="my-4 border-base-300">')
          .replace(/^> (.+)$/gm, '<blockquote class="border-l-4 border-primary/30 pl-4 py-1 my-2 text-base-content/70 italic">$1</blockquote>')
          .replace(/^- \[x\] (.+)$/gm, '<li class="flex items-start gap-2"><input type="checkbox" checked disabled class="checkbox checkbox-xs checkbox-primary mt-1"> $1</li>')
          .replace(/^- \[ \] (.+)$/gm, '<li class="flex items-start gap-2"><input type="checkbox" disabled class="checkbox checkbox-xs mt-1"> $1</li>')
          .replace(/^  - (.+)$/gm, '<li class="ml-4 text-sm">$1</li>')
          .replace(/^- (.+)$/gm, '<li class="text-sm">$1</li>')
          .replace(/^\d+\. (.+)$/gm, '<li class="text-sm">$1</li>')
          .replace(/((?:<li class="ml-4 text-sm">.*<\/li>\s*)+)/g, '<ul class="list-disc ml-4 space-y-1">$1</ul>')
          .replace(/((?:<li class="text-sm">.*<\/li>\s*)+)/g, '<ul class="list-disc ml-4 space-y-1 my-2">$1</ul>')
          .replace(/((?:<li class="flex.*<\/li>\s*)+)/g, '<ul class="space-y-1 my-2">$1</ul>')
          .replace(/^(?!<[a-z])((?!<).+)$/gm, '<p class="my-2 text-sm leading-relaxed">$1</p>');

        html = html.replace(/>([^<]+)</g, function (m, content) {
          return '>' + inlineMarkdown(content) + '<';
        });

        return html;
      }

      function inlineMarkdown(text) {
        return text
          .replace(/`([^`]+)`/g, '<code class="text-xs bg-base-300/50 px-1.5 py-0.5 rounded">$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold">$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" class="link link-primary">$1</a>');
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      fetch(basePath + 'meta.json')
        .then(function (r) {
          if (!r.ok) throw new Error('Not found');
          return r.json();
        })
        .then(function (data) {
          meta = data;
          document.title = meta.title + ' — devmade-ai';
          var metaDesc = document.querySelector('meta[name="description"]');
          if (!metaDesc) {
            metaDesc = document.createElement('meta');
            metaDesc.setAttribute('name', 'description');
            document.head.appendChild(metaDesc);
          }
          metaDesc.setAttribute('content', meta.description);
          render();
          var docFiles = [
            { key: 'readme', file: 'README.md', label: 'Overview' },
            { key: 'userGuide', file: 'USER_GUIDE.md', label: 'User Guide' },
            { key: 'testingGuide', file: 'TESTING_GUIDE.md', label: 'Testing Guide' },
            { key: 'tutorial', file: 'TUTORIAL.md', label: 'Tutorial' }
          ];
          docFiles.forEach(function (doc) {
            if (meta.docs[doc.key]) {
              fetch(basePath + doc.file)
                .then(function (r) { return r.ok ? r.text() : null; })
                .then(function (text) {
                  if (text) {
                    docs[doc.key] = text;
                    render();
                  }
                });
            }
          });
        })
        .catch(function () {
          app.innerHTML = '<div class="text-center py-16"><h1 class="text-2xl font-bold mb-2">Project not found</h1><p class="text-base-content/60">"' + escapeHtml(projectName) + '" does not exist.</p><p class="mt-2"><a href="./" class="link link-primary">Back to portfolio</a></p></div>';
        });

      function render() {
        if (!meta) return;

        var statusClass = meta.liveUrl ? 'bg-success' : 'bg-base-content/30';
        var statusLabel = meta.liveUrl ? 'Live' : 'No live URL';

        var linksHtml = '';
        if (meta.liveUrl) {
          linksHtml += '<a href="' + escapeHtml(meta.liveUrl) + '" target="_blank" rel="noopener" class="btn btn-outline btn-sm gap-1">Visit app</a>';
        }
        if (meta.repoUrl) {
          linksHtml += '<a href="' + escapeHtml(meta.repoUrl) + '" target="_blank" rel="noopener" class="btn btn-outline btn-sm gap-1">Source code</a>';
        }
        if (!meta.repoUrl && meta.repo === 'private') {
          linksHtml += '<span class="btn btn-outline btn-sm btn-disabled opacity-50">Private repository</span>';
        }

        var techHtml = meta.tech ? meta.tech.map(function (t) { return '<span class="badge badge-ghost badge-sm">' + t + '</span>'; }).join('') : '';
        var useCasesHtml = meta.useCases ? meta.useCases.map(function (u) { return '<li class="text-sm text-base-content/70">' + escapeHtml(u) + '</li>'; }).join('') : '<p class="text-sm text-base-content/40">Coming soon.</p>';

        var privacyHtml = '';
        if (meta.dataPrivacy) {
          Object.keys(meta.dataPrivacy).forEach(function (key) {
            var label = key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
            privacyHtml += '<div class="mb-2"><span class="font-semibold text-sm text-base-content">' + escapeHtml(label) + ':</span> <span class="text-sm text-base-content/70">' + escapeHtml(meta.dataPrivacy[key]) + '</span></div>';
          });
        }

        var tabDefs = [
          { key: 'readme', label: 'Overview', available: meta.docs.readme },
          { key: 'userGuide', label: 'User Guide', available: meta.docs.userGuide },
          { key: 'testingGuide', label: 'Testing Guide', available: meta.docs.testingGuide },
          { key: 'tutorial', label: 'Tutorial', available: meta.docs.tutorial }
        ];

        var tabsHtml = tabDefs.map(function (tab) {
          if (!tab.available) {
            return '<button class="tab text-base-content/30 cursor-default" disabled>' + tab.label + '</button>';
          }
          var activeClass = tab.key === currentTab ? ' tab-active' : '';
          return '<button class="tab' + activeClass + '" data-tab="' + tab.key + '">' + tab.label + '</button>';
        }).join('');

        var docContent = '';
        var fileMap = { readme: 'README.md', userGuide: 'USER_GUIDE.md', testingGuide: 'TESTING_GUIDE.md', tutorial: 'TUTORIAL.md' };
        if (docs[currentTab]) {
          var rawUrl = basePath + fileMap[currentTab];
          docContent = '<div class="card bg-base-200/50 border border-base-300"><div class="card-body">' +
            '<div class="flex gap-3 mb-4 no-print">' +
            '<button id="copy-btn" class="btn btn-outline btn-sm gap-1" onclick="copyDoc()">Copy markdown</button>' +
            '<a href="' + rawUrl + '" class="btn btn-outline btn-sm gap-1" target="_blank">Raw file</a>' +
            '</div>' +
            '<div class="md-render">' + renderMarkdown(docs[currentTab]) + '</div></div></div>';
        } else if (tabDefs.find(function (t) { return t.key === currentTab; }).available) {
          docContent = '<div class="card bg-base-200/50 border border-base-300"><div class="card-body"><p class="text-center py-8 text-base-content/40">Loading...</p></div></div>';
        } else {
          docContent = '<div class="card bg-base-200/50 border border-base-300"><div class="card-body"><p class="text-center py-12 text-base-content/40 italic">Coming soon.</p></div></div>';
        }

        app.innerHTML =
          '<p class="text-sm mb-4"><a href="./" class="link link-primary">&larr; All projects</a></p>' +

          '<header class="mb-6 animate-fade-in-up">' +
            '<div class="flex items-center gap-3 flex-wrap">' +
              '<h1 class="text-3xl font-bold">' + escapeHtml(meta.title) + '</h1>' +
              '<span class="badge badge-primary">' + escapeHtml(meta.badge) + '</span>' +
              '<span class="badge badge-ghost">' + escapeHtml(meta.repo) + '</span>' +
              '<span class="inline-flex items-center gap-1.5 text-sm font-medium"><span class="w-2 h-2 rounded-full ' + statusClass + '"></span>' + statusLabel + '</span>' +
            '</div>' +
            '<p class="text-base-content/60 mt-2">' + escapeHtml(meta.description) + '</p>' +
            '<div class="flex flex-wrap gap-2 mt-3">' + linksHtml + '</div>' +
            '<div class="flex flex-wrap gap-1.5 mt-3">' + techHtml + '</div>' +
          '</header>' +

          '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-6">' +
            '<div class="card bg-base-200/50 border border-base-300"><div class="card-body py-4"><h3 class="text-xs font-semibold uppercase tracking-wider text-base-content/50 mb-2">Who it\'s for</h3><p class="text-sm text-base-content/70">' + escapeHtml(meta.audience) + '</p></div></div>' +
            '<div class="card bg-base-200/50 border border-base-300"><div class="card-body py-4"><h3 class="text-xs font-semibold uppercase tracking-wider text-base-content/50 mb-2">Use cases</h3><ul class="list-disc ml-4 space-y-1">' + useCasesHtml + '</ul></div></div>' +
            '<div class="card bg-base-200/50 border border-base-300"><div class="card-body py-4"><h3 class="text-xs font-semibold uppercase tracking-wider text-base-content/50 mb-2">Data &amp; Privacy</h3>' + privacyHtml + '</div></div>' +
          '</div>' +

          '<div role="tablist" class="tabs tabs-bordered mb-6 no-print" id="doc-tabs">' + tabsHtml + '</div>' +
          '<div id="doc-content">' + docContent + '</div>';
      }

      // Requirement: Tab switching without accumulating event listeners
      // Approach: Event delegation on document — one listener handles all tabs
      // Alternative: Add/remove listeners in render() — rejected, causes
      //   listener accumulation (each render adds new handlers without removing old)
      document.addEventListener('click', function (e) {
        var tab = e.target.closest('.tab:not([disabled])');
        if (tab && tab.getAttribute('data-tab')) {
          currentTab = tab.getAttribute('data-tab');
          render();
        }
      });

      window.copyDoc = function () {
        var text = docs[currentTab];
        if (!text) return;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        var btn = document.getElementById('copy-btn');
        if (btn) {
          btn.textContent = 'Copied!';
          setTimeout(function () { btn.textContent = 'Copy markdown'; }, 1500);
        }
      };
    })();
  </script>
</body>
</html>
