<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading... — devmade-ai</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <!-- Requirement: Prevent dark mode flash (same as index.html) -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('darkMode');
        var isDark = stored !== null
          ? stored === 'true'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
      } catch(e) {}
    })();
  </script>

  <link rel="stylesheet" href="styles.css">
  <style>
    /* Project detail page specific styles */
    .project-hero { padding: 2.5rem 0 1.5rem; }
    .project-hero h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; }
    .project-hero .subtitle { color: var(--color-text-muted); margin-top: 0.25rem; font-size: 1rem; }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .meta-card {
      background: var(--color-surface-card);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 1.25rem;
    }

    .meta-card h3 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-subtle);
      margin-bottom: 0.75rem;
    }

    .meta-card p, .meta-card li {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    .meta-card ul {
      list-style: none;
      padding: 0;
    }

    .meta-card li {
      padding: 0.2rem 0;
      padding-left: 1rem;
      position: relative;
    }

    .meta-card li::before {
      content: '\2022';
      color: var(--color-accent);
      position: absolute;
      left: 0;
    }

    .privacy-item { margin-bottom: 0.5rem; }
    .privacy-label {
      font-weight: 600;
      color: var(--color-text);
      font-size: 0.85rem;
    }
    .privacy-value {
      color: var(--color-text-muted);
      font-size: 0.85rem;
    }

    .doc-tabs {
      display: flex;
      gap: 0.25rem;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 1.5rem;
      overflow-x: auto;
    }

    .doc-tab {
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-muted);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }

    .doc-tab:hover { color: var(--color-text); }
    .doc-tab.active {
      color: var(--color-accent);
      border-bottom-color: var(--color-accent);
    }

    .doc-tab.disabled {
      color: var(--color-text-subtle);
      opacity: 0.5;
      cursor: default;
    }

    .doc-content {
      background: var(--color-surface-card);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
      min-height: 200px;
    }

    .doc-actions {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .doc-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-surface);
      color: var(--color-text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }

    .doc-action-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    /* Rendered markdown styling */
    .md-render h1 { font-size: 1.5rem; font-weight: 700; margin: 1.5rem 0 0.75rem; }
    .md-render h2 { font-size: 1.25rem; font-weight: 700; margin: 1.5rem 0 0.5rem; border-bottom: 1px solid var(--color-border-subtle); padding-bottom: 0.35rem; }
    .md-render h3 { font-size: 1.1rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
    .md-render h4 { font-size: 1rem; font-weight: 600; margin: 1rem 0 0.35rem; }
    .md-render p { margin: 0.5rem 0; line-height: 1.7; color: var(--color-text-muted); }
    .md-render ul, .md-render ol { margin: 0.5rem 0; padding-left: 1.5rem; }
    .md-render li { margin: 0.25rem 0; line-height: 1.6; color: var(--color-text-muted); }
    .md-render strong { color: var(--color-text); }
    .md-render code {
      background: var(--color-code-bg);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.85em;
    }
    .md-render pre {
      background: var(--color-code-bg);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.75rem 0;
    }
    .md-render pre code {
      background: none;
      padding: 0;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .md-render table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
      font-size: 0.85rem;
    }
    .md-render th, .md-render td {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--color-border);
      text-align: left;
    }
    .md-render th {
      background: var(--color-surface-alt);
      font-weight: 600;
    }
    .md-render blockquote {
      border-left: 3px solid var(--color-accent);
      padding-left: 1rem;
      margin: 0.75rem 0;
      color: var(--color-text-subtle);
    }
    .md-render .nested-list { margin: 0.25rem 0 0.25rem 1rem; }
    .md-render a { color: var(--color-accent); text-decoration: none; }
    .md-render a:hover { text-decoration: underline; }
    .md-render hr { border: none; border-top: 1px solid var(--color-border); margin: 1.5rem 0; }
    .md-render input[type="checkbox"] { margin-right: 0.35rem; }

    .coming-soon {
      text-align: center;
      padding: 3rem;
      color: var(--color-text-subtle);
      font-style: italic;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    .status-dot.unknown { background: #a1a1aa; }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .tag {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--color-text-subtle);
      background: var(--color-badge-subtle-bg);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    .back-link:hover { color: var(--color-accent); }

    .error-state {
      text-align: center;
      padding: 4rem 1rem;
    }
    .error-state h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .error-state p { color: var(--color-text-muted); }

    @media (max-width: 640px) {
      .doc-content { padding: 1rem; }
      .meta-grid { grid-template-columns: 1fr; }
    }

    @media print {
      .doc-tabs, .doc-actions, .back-link { display: none !important; }
      .meta-card, .doc-content {
        break-inside: avoid;
        page-break-inside: avoid;
        border-color: #ccc !important;
        box-shadow: none !important;
      }
      .meta-card { background: white !important; }
      .doc-content { background: white !important; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header no-print">
    <div class="container header-inner">
      <a href="./" class="logo" aria-label="devmade-ai home">
        <img src="assets/images/icon-192.png" alt="" width="32" height="32" class="logo-icon">
        <span class="logo-text">devmade-ai</span>
      </a>
      <nav class="header-nav" aria-label="Main navigation">
        <a href="./#projects">Projects</a>
        <a href="./#tools">Tools</a>
        <a href="./#patterns">Patterns</a>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <div class="container" style="padding-top: 1rem; padding-bottom: 3rem;">
      <div id="app">
        <p style="color: var(--color-text-muted); padding: 4rem 0; text-align: center;">Loading...</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p><a href="https://github.com/devmade-ai" target="_blank" rel="noopener">github.com/devmade-ai</a></p>
    </div>
  </footer>

  <script src="theme.js"></script>
  <!-- Requirement: Render markdown docs client-side without a build step
       Approach: Lightweight custom parser for common markdown (headings, lists, code, tables, links)
       Alternative: marked.js from CDN — rejected, adds external dependency and ~40KB download -->
  <script>
    (function () {
      var app = document.getElementById('app');
      var params = new URLSearchParams(window.location.search);
      var projectName = params.get('name');

      if (!projectName) {
        app.innerHTML = '<div class="error-state"><h1>No project specified</h1><p><a href="./">Back to portfolio</a></p></div>';
        return;
      }

      var basePath = 'projects/' + encodeURIComponent(projectName) + '/';
      var meta = null;
      var docs = {};
      var currentTab = 'readme';

      // Lightweight markdown to HTML converter
      // Requirement: Render markdown docs readable on the portfolio site
      // Approach: Custom parser handling common markdown syntax
      // Alternative: marked.js — rejected, external dependency for a static site
      function renderMarkdown(md) {
        if (!md) return '';
        var html = md
          // Code blocks (must be before other processing)
          .replace(/```(\w*)\n([\s\S]*?)```/g, function (_, lang, code) {
            return '<pre><code>' + escapeHtml(code.trim()) + '</code></pre>';
          })
          // Tables
          .replace(/^\|(.+)\|\s*\n\|[\s\-:|]+\|\s*\n((?:\|.+\|\s*\n?)*)/gm, function (_, header, body) {
            var ths = header.split('|').map(function (h) { return '<th>' + h.trim() + '</th>'; }).join('');
            var rows = body.trim().split('\n').map(function (row) {
              var tds = row.replace(/^\||\|$/g, '').split('|').map(function (d) { return '<td>' + inlineMarkdown(d.trim()) + '</td>'; }).join('');
              return '<tr>' + tds + '</tr>';
            }).join('');
            return '<table><thead><tr>' + ths + '</tr></thead><tbody>' + rows + '</tbody></table>';
          })
          // Headings
          .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
          .replace(/^### (.+)$/gm, '<h3>$1</h3>')
          .replace(/^## (.+)$/gm, '<h2>$1</h2>')
          .replace(/^# (.+)$/gm, '<h1>$1</h1>')
          // Horizontal rules
          .replace(/^---+$/gm, '<hr>')
          // Blockquotes
          .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
          // Checkbox lists
          .replace(/^- \[x\] (.+)$/gm, '<li><input type="checkbox" checked disabled> $1</li>')
          .replace(/^- \[ \] (.+)$/gm, '<li><input type="checkbox" disabled> $1</li>')
          // Unordered lists (indented and top-level)
          .replace(/^  - (.+)$/gm, '<li class="nested">$1</li>')
          .replace(/^- (.+)$/gm, '<li>$1</li>')
          // Ordered lists
          .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
          // Wrap consecutive nested <li> in nested <ul>
          .replace(/((?:<li class="nested">.*<\/li>\s*)+)/g, '<ul class="nested-list">$1</ul>')
          // Wrap consecutive <li> in <ul>
          .replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>')
          // Paragraphs (lines not already tagged)
          .replace(/^(?!<[a-z])((?!<).+)$/gm, '<p>$1</p>');

        // Apply inline markdown to all content inside tags
        html = html.replace(/>([^<]+)</g, function (m, content) {
          return '>' + inlineMarkdown(content) + '<';
        });

        return html;
      }

      function inlineMarkdown(text) {
        return text
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\*([^*]+)\*/g, '<em>$1</em>')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // Fetch meta.json
      fetch(basePath + 'meta.json')
        .then(function (r) {
          if (!r.ok) throw new Error('Not found');
          return r.json();
        })
        .then(function (data) {
          meta = data;
          document.title = meta.title + ' — devmade-ai';
          render();
          // Fetch available docs
          var docFiles = [
            { key: 'readme', file: 'README.md', label: 'Overview' },
            { key: 'userGuide', file: 'USER_GUIDE.md', label: 'User Guide' },
            { key: 'testingGuide', file: 'TESTING_GUIDE.md', label: 'Testing Guide' },
            { key: 'tutorial', file: 'TUTORIAL.md', label: 'Tutorial' }
          ];
          docFiles.forEach(function (doc) {
            if (meta.docs[doc.key]) {
              fetch(basePath + doc.file)
                .then(function (r) { return r.ok ? r.text() : null; })
                .then(function (text) {
                  if (text) {
                    docs[doc.key] = text;
                    render();
                  }
                });
            }
          });
        })
        .catch(function () {
          app.innerHTML = '<div class="error-state"><h1>Project not found</h1><p>"' + escapeHtml(projectName) + '" does not exist.</p><p><a href="./">Back to portfolio</a></p></div>';
        });

      function render() {
        if (!meta) return;

        var statusClass = meta.liveUrl ? '' : ' unknown';
        var statusLabel = meta.liveUrl ? 'Live' : 'No live URL';

        var linksHtml = '';
        if (meta.liveUrl) {
          linksHtml += '<a href="' + meta.liveUrl + '" target="_blank" rel="noopener" class="doc-action-btn">Visit app</a>';
        }
        if (meta.repoUrl) {
          linksHtml += '<a href="' + meta.repoUrl + '" target="_blank" rel="noopener" class="doc-action-btn">Source code</a>';
        }
        if (!meta.repoUrl && meta.repo === 'private') {
          linksHtml += '<span class="doc-action-btn" style="cursor:default;opacity:0.5;">Private repository</span>';
        }

        // Tech tags
        var techHtml = meta.tech ? meta.tech.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') : '';

        // Use cases
        var useCasesHtml = meta.useCases ? meta.useCases.map(function (u) { return '<li>' + u + '</li>'; }).join('') : '<p>Coming soon.</p>';

        // Privacy
        var privacyHtml = '';
        if (meta.dataPrivacy) {
          Object.keys(meta.dataPrivacy).forEach(function (key) {
            var label = key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
            privacyHtml += '<div class="privacy-item"><span class="privacy-label">' + label + ':</span> <span class="privacy-value">' + meta.dataPrivacy[key] + '</span></div>';
          });
        }

        // Doc tabs
        var tabDefs = [
          { key: 'readme', label: 'Overview', available: meta.docs.readme },
          { key: 'userGuide', label: 'User Guide', available: meta.docs.userGuide },
          { key: 'testingGuide', label: 'Testing Guide', available: meta.docs.testingGuide },
          { key: 'tutorial', label: 'Tutorial', available: meta.docs.tutorial }
        ];

        var tabsHtml = tabDefs.map(function (tab) {
          if (!tab.available) {
            return '<button class="doc-tab disabled" disabled>' + tab.label + '</button>';
          }
          var activeClass = tab.key === currentTab ? ' active' : '';
          return '<button class="doc-tab' + activeClass + '" data-tab="' + tab.key + '">' + tab.label + '</button>';
        }).join('');

        // Doc content
        var docContent = '';
        var fileMap = { readme: 'README.md', userGuide: 'USER_GUIDE.md', testingGuide: 'TESTING_GUIDE.md', tutorial: 'TUTORIAL.md' };
        if (docs[currentTab]) {
          var rawUrl = basePath + fileMap[currentTab];
          docContent = '<div class="doc-actions">' +
            '<button class="doc-action-btn" onclick="copyDoc()">Copy markdown</button>' +
            '<a href="' + rawUrl + '" class="doc-action-btn" target="_blank">Raw file</a>' +
            '</div>' +
            '<div class="md-render">' + renderMarkdown(docs[currentTab]) + '</div>';
        } else if (tabDefs.find(function (t) { return t.key === currentTab; }).available) {
          docContent = '<p style="color:var(--color-text-subtle);text-align:center;padding:2rem;">Loading...</p>';
        } else {
          docContent = '<div class="coming-soon">Coming soon.</div>';
        }

        app.innerHTML =
          '<a href="./" class="back-link">&larr; All projects</a>' +
          '<section class="project-hero">' +
            '<div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">' +
              '<h1>' + escapeHtml(meta.title) + '</h1>' +
              '<span class="badge">' + meta.badge + '</span>' +
              '<span class="badge badge-subtle">' + meta.repo + '</span>' +
              '<span class="status-badge"><span class="status-dot' + statusClass + '"></span>' + statusLabel + '</span>' +
            '</div>' +
            '<p class="subtitle">' + escapeHtml(meta.description) + '</p>' +
            '<div style="margin-top:0.75rem;">' + linksHtml + '</div>' +
            '<div class="tag-list">' + techHtml + '</div>' +
          '</section>' +

          '<div class="meta-grid">' +
            '<div class="meta-card"><h3>Who it\'s for</h3><p>' + escapeHtml(meta.audience) + '</p></div>' +
            '<div class="meta-card"><h3>Use cases</h3><ul>' + useCasesHtml + '</ul></div>' +
            '<div class="meta-card"><h3>Data &amp; Privacy</h3>' + privacyHtml + '</div>' +
          '</div>' +

          '<div class="doc-tabs" id="doc-tabs">' + tabsHtml + '</div>' +
          '<div class="doc-content" id="doc-content">' + docContent + '</div>';

        // Attach tab click handlers
        document.querySelectorAll('.doc-tab:not(.disabled)').forEach(function (btn) {
          btn.addEventListener('click', function () {
            currentTab = this.getAttribute('data-tab');
            render();
          });
        });
      }

      // Global copy function for the doc action button
      window.copyDoc = function () {
        var text = docs[currentTab];
        if (!text) return;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        var btn = document.querySelector('.doc-action-btn');
        if (btn) {
          var original = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(function () { btn.textContent = original; }, 1500);
        }
      };
    })();
  </script>
</body>
</html>
