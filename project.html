<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';">
  <title>Loading... — devmade-ai</title>
  <meta property="og:title" content="devmade-ai — Project Details">
  <meta property="og:description" content="Software projects, internal tools, and reusable engineering patterns by devmade-ai.">
  <meta property="og:image" content="https://devmade-ai.github.io/glow-props/assets/images/icon-512.png">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">

  <!-- Shared <head> content injected from partials/head-common.html by htmlPartials Vite plugin -->
  <!-- HEAD_COMMON -->
</head>
<body class="bg-base-100 text-base-content min-h-screen">

  <!-- SKIP_LINK -->

  <!-- Navbar injected from partials/navbar.html by htmlPartials Vite plugin.
       NAV_PREFIX is "./" for project.html (cross-page #anchors back to index). -->
  <!-- NAVBAR:./ -->
  <main id="main" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="app">
      <p class="text-center py-16 text-base-content/40">Loading...</p>
    </div>
  </main>

  <footer class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center border-t border-base-300"
          style="padding-bottom: max(1.5rem, env(safe-area-inset-bottom));">
    <p class="text-sm text-base-content/40">
      <a href="https://github.com/devmade-ai" target="_blank" rel="noopener" class="link link-hover text-base-content/40 hover:text-base-content/70">github.com/devmade-ai</a>
    </p>
  </footer>

  <script src="theme.js"></script>
  <script src="markdown.js"></script>
  <!-- Requirement: Render markdown docs client-side without a build step
       Approach: Shared markdown.js provides renderMarkdown, escapeHtml, isSafeUrl, copyMarkdown.
         This script handles project-specific logic: metadata fetch, tabs, doc loading.
       Alternative: marked.js from CDN — rejected, adds external dependency and ~40KB download -->
  <script>
    (function () {
      var app = document.getElementById('app');
      var params = new URLSearchParams(window.location.search);
      var projectName = params.get('name');

      // Requirement: Validate projectName format to prevent path traversal attempts
      // Approach: Allowlist alphanumeric + hyphens only. Reject anything else.
      if (!projectName || !/^[a-z0-9-]+$/i.test(projectName)) {
        app.innerHTML = '<div class="text-center py-16"><h1 class="text-2xl font-bold mb-2">No project specified</h1><p class="text-base-content/60"><a href="./" class="link link-primary">Back to portfolio</a></p></div>';
        return;
      }

      var basePath = 'projects/' + encodeURIComponent(projectName) + '/';
      var meta = null;
      var docs = {};
      var currentTab = 'readme';

      // Markdown rendering, escaping, URL validation, and copy provided by shared markdown.js
      var renderMarkdown = md.renderMarkdown;
      var escapeHtml = md.escapeHtml;
      var isSafeUrl = md.isSafeUrl;

      // Requirement: Timeout on metadata fetch to avoid indefinite loading on slow/broken networks
      // Approach: AbortController with 10s timeout — shows error instead of endless spinner
      var fetchController = new AbortController();
      var fetchTimeout = setTimeout(function () { fetchController.abort(); }, 10000);

      // Requirement: Timeout on doc file fetches to prevent indefinite loading
      // Approach: Each doc file gets its own AbortController with 15s timeout.
      //   meta.json gets 10s (critical), doc files get 15s (supplemental).
      var DOC_TIMEOUT_MS = 15000;

      fetch(basePath + 'meta.json', { signal: fetchController.signal })
        .then(function (r) {
          clearTimeout(fetchTimeout);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          meta = data;
          // Requirement: Defensive defaults for missing meta.json fields
          // Approach: Ensure all rendered fields have fallbacks to prevent "undefined" in HTML
          meta.title = meta.title || projectName;
          meta.description = meta.description || '';
          meta.badge = meta.badge || '';
          meta.repo = meta.repo || '';
          meta.audience = meta.audience || 'Not specified';
          meta.tech = meta.tech || [];
          meta.useCases = meta.useCases || [];
          meta.dataPrivacy = meta.dataPrivacy || {};
          meta.docs = meta.docs || {};

          document.title = meta.title + ' — devmade-ai';
          var metaDesc = document.querySelector('meta[name="description"]');
          if (!metaDesc) {
            metaDesc = document.createElement('meta');
            metaDesc.setAttribute('name', 'description');
            document.head.appendChild(metaDesc);
          }
          metaDesc.setAttribute('content', meta.description);
          render();
          var docFiles = [
            { key: 'readme', file: 'README.md', label: 'Overview' },
            { key: 'userGuide', file: 'USER_GUIDE.md', label: 'User Guide' },
            { key: 'testingGuide', file: 'TESTING_GUIDE.md', label: 'Testing Guide' },
            { key: 'tutorial', file: 'TUTORIAL.md', label: 'Tutorial' }
          ];
          docFiles.forEach(function (doc) {
            if (meta.docs[doc.key]) {
              var docController = new AbortController();
              var docTimeout = setTimeout(function () { docController.abort(); }, DOC_TIMEOUT_MS);
              fetch(basePath + doc.file, { signal: docController.signal })
                .then(function (r) {
                  clearTimeout(docTimeout);
                  return r.ok ? r.text() : null;
                })
                .then(function (text) {
                  if (text) {
                    docs[doc.key] = text;
                    render();
                  }
                })
                .catch(function (err) {
                  clearTimeout(docTimeout);
                  // Requirement: Distinguish timeout from network error for debugging
                  // Doc file failed to load — project still renders without it.
                  // Mark as failed so the tab shows an error state instead of "Loading..." forever.
                  docs[doc.key] = null;
                  render();
                });
            }
          });
        })
        .catch(function (err) {
          // Requirement: Differentiate timeout/network errors from missing projects
          // Approach: Check error type to show appropriate message and action
          var isTimeout = err && err.name === 'AbortError';
          var title = isTimeout ? 'Request timed out' : 'Project not found';
          var body = isTimeout
            ? 'Could not load project data. Check your connection and try again.'
            : '"' + escapeHtml(projectName) + '" does not exist.';
          var retryHtml = isTimeout
            ? '<p class="mt-2"><button onclick="location.reload()" class="btn btn-primary btn-sm">Retry</button></p>'
            : '';
          app.innerHTML = '<div class="text-center py-16"><h1 class="text-2xl font-bold mb-2">' + title + '</h1><p class="text-base-content/60">' + body + '</p>' + retryHtml + '<p class="mt-2"><a href="./" class="link link-primary">Back to portfolio</a></p></div>';
        });

      function render() {
        if (!meta) return;

        var statusClass = meta.liveUrl ? 'bg-success' : 'bg-base-content/30';
        var statusLabel = meta.liveUrl ? 'Live' : 'No live URL';

        var linksHtml = '';
        if (meta.liveUrl && isSafeUrl(meta.liveUrl)) {
          linksHtml += '<a href="' + escapeHtml(meta.liveUrl) + '" target="_blank" rel="noopener" class="btn btn-outline btn-sm gap-1">Visit app</a>';
        }
        if (meta.repoUrl && isSafeUrl(meta.repoUrl)) {
          linksHtml += '<a href="' + escapeHtml(meta.repoUrl) + '" target="_blank" rel="noopener" class="btn btn-outline btn-sm gap-1">Source code</a>';
        }
        if (!meta.repoUrl && meta.repo === 'private') {
          linksHtml += '<span class="btn btn-outline btn-sm btn-disabled opacity-50">Private repository</span>';
        }

        var techHtml = meta.tech ? meta.tech.map(function (t) { return '<span class="badge badge-ghost badge-sm">' + escapeHtml(t) + '</span>'; }).join('') : '';
        var useCasesHtml = meta.useCases ? meta.useCases.map(function (u) { return '<li class="text-sm text-base-content/70">' + escapeHtml(u) + '</li>'; }).join('') : '<p class="text-sm text-base-content/40">Coming soon.</p>';

        var privacyHtml = '';
        if (meta.dataPrivacy) {
          Object.keys(meta.dataPrivacy).forEach(function (key) {
            var label = key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1');
            privacyHtml += '<div class="mb-2"><span class="font-semibold text-sm text-base-content">' + escapeHtml(label) + ':</span> <span class="text-sm text-base-content/70">' + escapeHtml(meta.dataPrivacy[key]) + '</span></div>';
          });
        }

        var tabDefs = [
          { key: 'readme', label: 'Overview', available: meta.docs.readme },
          { key: 'userGuide', label: 'User Guide', available: meta.docs.userGuide },
          { key: 'testingGuide', label: 'Testing Guide', available: meta.docs.testingGuide },
          { key: 'tutorial', label: 'Tutorial', available: meta.docs.tutorial }
        ];

        var tabsHtml = tabDefs.map(function (tab) {
          if (!tab.available) {
            return '<button class="tab text-base-content/30 cursor-default" disabled>' + tab.label + '</button>';
          }
          var activeClass = tab.key === currentTab ? ' tab-active' : '';
          return '<button class="tab' + activeClass + '" data-tab="' + tab.key + '">' + tab.label + '</button>';
        }).join('');

        var docContent = '';
        var fileMap = { readme: 'README.md', userGuide: 'USER_GUIDE.md', testingGuide: 'TESTING_GUIDE.md', tutorial: 'TUTORIAL.md' };
        var tabDef = tabDefs.find(function (t) { return t.key === currentTab; });
        if (docs[currentTab]) {
          var rawUrl = basePath + fileMap[currentTab];
          docContent = '<div class="card bg-base-200/50 border border-base-300"><div class="card-body">' +
            '<div class="flex gap-3 mb-4 no-print">' +
            '<button id="copy-btn" class="btn btn-outline btn-sm gap-1" onclick="copyDoc()">Copy markdown</button>' +
            '<a href="' + rawUrl + '" class="btn btn-outline btn-sm gap-1" target="_blank">Raw file</a>' +
            '</div>' +
            '<div class="md-render">' + renderMarkdown(docs[currentTab]) + '</div></div></div>';
        } else if (docs[currentTab] === null) {
          // Doc fetch failed (network error or timeout) — show error with retry option
          docContent = '<div class="card bg-base-200/50 border border-base-300"><div class="card-body"><p class="text-center py-8 text-base-content/40">Failed to load this document. <button onclick="location.reload()" class="link link-primary">Retry</button></p></div></div>';
        } else if (tabDef && tabDef.available) {
          docContent = '<div class="card bg-base-200/50 border border-base-300"><div class="card-body"><p class="text-center py-8 text-base-content/40">Loading...</p></div></div>';
        } else {
          docContent = '<div class="card bg-base-200/50 border border-base-300"><div class="card-body"><p class="text-center py-12 text-base-content/40 italic">Coming soon.</p></div></div>';
        }

        app.innerHTML =
          '<p class="text-sm mb-4"><a href="./" class="link link-primary">&larr; All projects</a></p>' +

          '<header class="mb-6 animate-fade-in-up">' +
            '<div class="flex items-center gap-3 flex-wrap">' +
              '<h1 class="text-3xl font-bold">' + escapeHtml(meta.title) + '</h1>' +
              '<span class="badge badge-primary">' + escapeHtml(meta.badge) + '</span>' +
              '<span class="badge badge-ghost">' + escapeHtml(meta.repo) + '</span>' +
              '<span class="inline-flex items-center gap-1.5 text-sm font-medium"><span class="w-2 h-2 rounded-full ' + statusClass + '"></span>' + statusLabel + '</span>' +
            '</div>' +
            '<p class="text-base-content/60 mt-2">' + escapeHtml(meta.description) + '</p>' +
            '<div class="flex flex-wrap gap-2 mt-3">' + linksHtml + '</div>' +
            '<div class="flex flex-wrap gap-1.5 mt-3">' + techHtml + '</div>' +
          '</header>' +

          '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-6">' +
            '<div class="card bg-base-200/50 border border-base-300"><div class="card-body py-4"><h3 class="text-xs font-semibold uppercase tracking-wider text-base-content/50 mb-2">Who it\'s for</h3><p class="text-sm text-base-content/70">' + escapeHtml(meta.audience) + '</p></div></div>' +
            '<div class="card bg-base-200/50 border border-base-300"><div class="card-body py-4"><h3 class="text-xs font-semibold uppercase tracking-wider text-base-content/50 mb-2">Use cases</h3><ul class="list-disc ml-4 space-y-1">' + useCasesHtml + '</ul></div></div>' +
            '<div class="card bg-base-200/50 border border-base-300"><div class="card-body py-4"><h3 class="text-xs font-semibold uppercase tracking-wider text-base-content/50 mb-2">Data &amp; Privacy</h3>' + privacyHtml + '</div></div>' +
          '</div>' +

          '<div role="tablist" class="tabs tabs-bordered mb-6 no-print" id="doc-tabs">' + tabsHtml + '</div>' +
          '<div id="doc-content">' + docContent + '</div>';
      }

      // Requirement: Tab switching with focus management for screen readers
      // Approach: Event delegation on document — one listener handles all tabs.
      //   After render, focus moves to the new content area so screen reader users
      //   hear the updated content without having to navigate back to it.
      // Alternative: Add/remove listeners in render() — rejected, causes
      //   listener accumulation (each render adds new handlers without removing old)
      document.addEventListener('click', function (e) {
        var tab = e.target.closest('.tab:not([disabled])');
        if (tab && tab.getAttribute('data-tab')) {
          currentTab = tab.getAttribute('data-tab');
          render();
          var content = document.getElementById('doc-content');
          if (content) {
            content.setAttribute('tabindex', '-1');
            content.focus({ preventScroll: true });
          }
        }
      });

      window.copyDoc = function () {
        md.copyMarkdown(docs[currentTab], 'copy-btn');
      };
    })();
  </script>

  <!-- PWA: service worker registration, update prompts, install detection -->
  <script type="module" src="src/pwa.js"></script>
</body>
</html>
