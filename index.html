<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- Requirement: PWA status bar color that matches the active DaisyUI theme
       Approach: Two meta tags with media queries — browser picks the one matching OS preference
         on initial load. JavaScript overwrites both to the active theme's color on every change.
         Light themes use primary hex, dark themes use base-100 hex — white status bar
         text must always be legible (see docs/AI_MISTAKES.md).
       Alternative: Single meta tag without media — rejected, causes flash on iOS where the
         browser reads the tag before JS runs and OS preference determines initial text color. -->
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#261b25" media="(prefers-color-scheme: dark)">
  <!-- Requirement: Defense-in-depth against XSS — restrict script/style sources
       Approach: CSP meta tag allowing self, inline scripts (required for flash prevention),
         Google Fonts, and Google Analytics (gtag.js + GA4 beacons).
         GA hosts must be kept in sync with the snippet in partials/head-common.html.
       Alternative: HTTP header — rejected, GitHub Pages doesn't allow custom headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net;">
  <link rel="canonical" href="https://devmade-ai.github.io/glow-props/">
  <title>devmade-ai</title>
  <meta name="description" content="Software projects, internal tools, and reusable engineering patterns by devmade-ai.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="devmade-ai">
  <meta property="og:title" content="devmade-ai — Project Portfolio">
  <meta property="og:description" content="Software projects, internal tools, and reusable engineering patterns by devmade-ai.">
  <meta property="og:url" content="https://devmade-ai.github.io/glow-props/">
  <meta property="og:image" content="https://devmade-ai.github.io/glow-props/assets/images/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The devmade-ai mark: four rounded squares in blue, emerald, amber and violet.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="devmade-ai — Project Portfolio">
  <meta name="twitter:description" content="Software projects, internal tools, and reusable engineering patterns by devmade-ai.">
  <meta name="twitter:image" content="https://devmade-ai.github.io/glow-props/assets/images/og-image.png">
  <!-- Base-absolute so the same head works from prerendered nested pages
       (patterns/<slug>/, projects/<slug>/) without per-page rebasing.
       The ?v= cache-bust query is appended at build by iconCacheBustHtml(). -->
  <link rel="icon" type="image/png" href="/glow-props/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="/glow-props/assets/images/apple-touch-icon.png">

  <!-- Shared <head> content injected from partials/head-common.html by htmlPartials Vite plugin.
       Includes: GA, dark mode bootstrap, beforeinstallprompt capture, fonts, main.css -->
  <!-- HEAD_COMMON -->
</head>
<body class="bg-base-100 text-base-content min-h-screen">

  <!-- React root. The build injects the SSG'd page markup here (crawlers and
       unfurlers read it); createRoot().render() replaces it on mount. -->
  <div id="root"></div>

  <script type="module" src="src/main-home.jsx"></script>
</body>
</html>
