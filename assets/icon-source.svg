<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" shape-rendering="geometricPrecision">
  <!-- Requirement: Geometric icon for devmade-ai portfolio
       Approach: Hexagon outline with dot grid inside — tech/network/node feel,
       references the project portfolio. Built from basic shapes (polygon + circles),
       no font dependencies, renders crisply at all sizes.
       Alternative: Lettermark "dm" — rejected, hand-drawn text paths were unreliable

       Colour: #db924c matches DaisyUI coffee theme primary (warm amber/gold).
       Previous #0ab1b1 (Pico CSS cyan) clashed with the warm caramellatte/coffee
       palette after migrating to Tailwind v4 + DaisyUI v5.
       Using the coffee (dark) theme primary because it has good contrast on both
       the dark coffee background and the light caramellatte background, and remains
       visually cohesive at the small sizes this icon is displayed (36px).

       Glow filter removed — the feGaussianBlur glow effect was adding a soft
       bloom around shapes that looked out of place in a clean UI. -->

  <!-- Hexagon outline — centered at 512,512, radius ~400 -->
  <polygon
    points="512,112 858,312 858,712 512,912 166,712 166,312"
    fill="none"
    stroke="#db924c"
    stroke-width="48"
    stroke-linejoin="round"
  />

  <!-- Dot grid — 3x3 arrangement, evenly spaced inside hexagon
       Dots are large enough to read at 48px favicon -->
  <!-- Row 1 (y=340) -->
  <circle cx="352" cy="340" r="36" fill="#db924c"/>
  <circle cx="512" cy="340" r="36" fill="#db924c"/>
  <circle cx="672" cy="340" r="36" fill="#db924c"/>

  <!-- Row 2 (y=512) -->
  <circle cx="352" cy="512" r="36" fill="#db924c"/>
  <circle cx="512" cy="512" r="44" fill="#db924c"/>
  <circle cx="672" cy="512" r="36" fill="#db924c"/>

  <!-- Row 3 (y=684) -->
  <circle cx="352" cy="684" r="36" fill="#db924c"/>
  <circle cx="512" cy="684" r="36" fill="#db924c"/>
  <circle cx="672" cy="684" r="36" fill="#db924c"/>

  <!-- Connecting lines between dots — subtle network effect -->
  <g stroke="#db924c" stroke-width="12" opacity="0.35">
    <!-- Horizontal connections -->
    <line x1="388" y1="340" x2="476" y2="340"/>
    <line x1="548" y1="340" x2="636" y2="340"/>
    <line x1="388" y1="512" x2="468" y2="512"/>
    <line x1="556" y1="512" x2="636" y2="512"/>
    <line x1="388" y1="684" x2="476" y2="684"/>
    <line x1="548" y1="684" x2="636" y2="684"/>

    <!-- Vertical connections -->
    <line x1="352" y1="376" x2="352" y2="476"/>
    <line x1="512" y1="376" x2="512" y2="468"/>
    <line x1="672" y1="376" x2="672" y2="476"/>
    <line x1="352" y1="548" x2="352" y2="648"/>
    <line x1="512" y1="556" x2="512" y2="648"/>
    <line x1="672" y1="548" x2="672" y2="648"/>

    <!-- Diagonal connections from center -->
    <line x1="475" y1="475" x2="389" y2="377"/>
    <line x1="549" y1="475" x2="635" y2="377"/>
    <line x1="475" y1="549" x2="389" y2="647"/>
    <line x1="549" y1="549" x2="635" y2="647"/>
  </g>
</svg>
