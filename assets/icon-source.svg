<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" shape-rendering="geometricPrecision">
  <!-- Requirement: "dm" lettermark icon for devmade-ai portfolio
       Approach: Bold filled "dm" using a web font rendered as text element.
       Transparent background works in both light/dark mode headers.
       Alternative: Path-drawn letters — rejected, hard to get legible geometry -->

  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.02
                0 0 0 0 0.71
                0 0 0 0 0.83
                0 0 0 0.3 0" result="colored"/>
      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- "dm" text — bold, geometric sans-serif, centered -->
  <text
    x="512" y="580"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="520"
    letter-spacing="-20"
    fill="#06b6d4"
    filter="url(#glow)"
  >dm</text>
</svg>
