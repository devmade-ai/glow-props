<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" shape-rendering="geometricPrecision">
  <!-- Requirement: Portfolio icon for devmade-ai — represents a collection of projects
       Approach: 2x2 grid of rounded squares, each a different color.
         Conveys "collection / gallery / multiple projects" at a glance.
         Multi-color palette is theme-independent — the icon carries its own identity,
         so it won't clash with any DaisyUI theme combo.
       Alternative: Hexagon with dot grid — rejected, felt like a knowledge graph tool,
         not a portfolio. Prism/gem — rejected, harder to read at 48px favicon size.
         Single-color icon — rejected, would clash with some theme combos.

       Colours chosen for:
         - Distinct hues that read as separate at 48px
         - Good contrast on both white and dark backgrounds
         - Modern, vibrant, tech-forward feel
         Blue #3b82f6, Emerald #10b981, Amber #f59e0b, Violet #8b5cf6

       Layout: 4 squares, 360x360 each, 48px gap, 48px corner radius.
         All content within inner 80% safe zone (maskable icon crop). -->

  <!-- Background — required for maskable PWA icon (no transparency) -->
  <rect width="1024" height="1024" rx="0" fill="#ffffff"/>

  <!-- Top-left: Blue — represents structure, engineering -->
  <rect x="128" y="128" width="360" height="360" rx="48" fill="#3b82f6"/>

  <!-- Top-right: Emerald — represents growth, shipping -->
  <rect x="536" y="128" width="360" height="360" rx="48" fill="#10b981"/>

  <!-- Bottom-left: Amber — represents creativity, design -->
  <rect x="128" y="536" width="360" height="360" rx="48" fill="#f59e0b"/>

  <!-- Bottom-right: Violet — represents innovation, craft -->
  <rect x="536" y="536" width="360" height="360" rx="48" fill="#8b5cf6"/>
</svg>
